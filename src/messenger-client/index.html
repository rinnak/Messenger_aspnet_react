<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Настраиваем ширину страницы для мобильных устройств. -->
    <title>Мессенджер</title>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; ;">
    <defs>
        <filter id="messenger-glass-refraction" x="-10%" y="-25%" width="120%" height="150%">
            <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.018 0.04"
                    numOctaves="1"
                    seed="7"
                    result="map"
            />
            <feDisplacementMap
                    in="SourceGraphic"
                    in2="map"
                    scale="7"
                    xChannelSelector="R"
                    yChannelSelector="G"
            />
        </filter>
    </defs>
</svg>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
