services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger_local
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "messenger", "-d", "messenger"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: LocalDocker
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Messenger: "Host=db;Port=5432;Database=messenger;Username=messenger;Password=messenger_local"
      SignalR__AllowedOrigin: "http://localhost:8080"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data: